<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compartilhar tela</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; text-align: center; margin: 0; padding: 24px; }
    h1 { margin-top: 0; }
    .cards { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .card { background: #1c1c1c; border-radius: 12px; padding: 20px; width: 300px; }
    button { font-size: 16px; padding: 10px 20px; border: 0; border-radius: 8px; cursor: pointer; background: #4caf50; color: #fff; }
    button.vermelho { background: #e53935; }
    button.cinza { background: #555; }
    button.azul { background: #1e88e5; }
    button.pequeno { font-size: 14px; padding: 6px 12px; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    input[type=text] { font-size: 18px; padding: 8px; width: 150px; text-align: center; text-transform: uppercase; border-radius: 8px; border: 1px solid #444; background: #000; color: #fff; }
    select { font-size: 15px; padding: 6px; border-radius: 8px; background: #000; color: #fff; border: 1px solid #444; }
    label { display: block; margin: 10px 0; font-size: 14px; color: #ccc; }
    small { display: block; color: #888; font-size: 12px; margin-top: 4px; }
    #status { margin: 16px 0; color: #aaa; min-height: 24px; }
    #info { display: none; margin-top: 12px; }
    #codigoTexto { font-size: 32px; letter-spacing: 4px; font-weight: bold; color: #4caf50; }
    #info button { margin: 4px 0; }
    #stats { font-size: 13px; color: #aaa; margin-top: 6px; }
    #barraVer { display: none; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; margin-top: 8px; }
    video { display: none; width: 100%; max-width: 960px; margin-top: 12px; background: #000; border-radius: 8px; }
    video.previa { max-width: 320px; }
    #parar { display: none; margin-top: 12px; }
    /* Modo compacto (link ?c=CODIGO&ver=1): só o vídeo, bom para abrir ao lado de outra página */
    body.compacto { padding: 8px; }
    body.compacto h1, body.compacto .cards { display: none; }
    body.compacto #status { margin: 8px 0; }
    body.compacto video { max-width: 100%; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Compartilhar tela</h1>

  <div class="cards">
    <div class="card">
      <h3>Quero compartilhar</h3>
      <p id="avisoCelular" style="display:none;background:#3a2a00;color:#ffcc66;border-radius:8px;padding:10px;font-size:14px;margin-top:0"></p>

      <label>Qualidade:
        <select id="qualidade">
          <option value="auto">Automático (720p, se adapta)</option>
          <option value="leve">Leve (540p, 30 fps)</option>
          <option value="texto">Slides e texto (720p, 10 fps)</option>
          <option value="alta">Alta (1080p, 30 fps)</option>
        </select>
      </label>
      <label>Código da sala (opcional):
        <input type="text" id="salaFixa" maxlength="12" placeholder="ex: MESA01">
        <small>Em branco: gera um código novo a cada vez. Com código fixo, o link de quem assiste nunca muda.</small>
      </label>
      <label><input type="checkbox" id="previa"> Mostrar prévia da minha tela (usa mais RAM)</label>
      <label><input type="checkbox" id="audio"> Compartilhar áudio</label>

      <button id="compartilhar">Compartilhar minha tela</button>

      <div id="info">
        <div>Código:</div>
        <div id="codigoTexto"></div>
        <button id="copiarLink" class="cinza">Copiar link de quem assiste</button><br>
        <button id="trocar" class="azul">Trocar tela</button>
        <div id="espectadores"></div>
        <div id="stats"></div>
      </div>
    </div>

    <div class="card">
      <h3>Quero assistir</h3>
      <p>Digite o código que você recebeu.</p>
      <input type="text" id="codigo" maxlength="12" placeholder="CÓDIGO">
      <p><button id="assistir">Assistir</button></p>
    </div>
  </div>

  <p id="status"></p>

  <div id="barraVer">
    <button id="som" class="cinza pequeno">🔊 Ativar som</button>
    <button id="telaCheia" class="cinza pequeno">⛶ Tela cheia</button>
    <label style="margin:0">Qualidade:
      <select id="qualidadeVer">
        <option value="auto">Automática</option>
        <option value="leve">Leve (540p)</option>
        <option value="muitoleve">Muito leve (360p)</option>
      </select>
    </label>
  </div>

  <button id="parar" class="vermelho">Parar</button>
  <video id="video" autoplay playsinline muted controls></video>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const video = $("video");
    const PREFIXO = "telasimples-";
    // Cada espectador faz seu computador codificar o vídeo mais uma vez,
    // então o gasto de CPU/RAM cresce com o número de pessoas.
    const MAX_ESPECTADORES = 4;

    // OPCIONAL: servidor TURN próprio, para quem está em rede restrita (4G, empresa, escola).
    // Crie uma conta grátis em metered.ca e preencha os dois campos abaixo.
    const METERED_APP = "";   // exemplo: "meuapp" (o que vem antes de .metered.live)
    const METERED_KEY = "";   // a API key da sua conta

    // Quanto menor a resolução, os quadros por segundo e o bitrate, menos RAM e CPU
    const QUALIDADES = {
      auto:  { w: 1280, h: 720,  fps: 30, bitrate: 2500000, hint: "motion" },
      leve:  { w: 960,  h: 540,  fps: 30, bitrate: 1500000, hint: "motion" },
      texto: { w: 1280, h: 720,  fps: 10, bitrate: 800000,  hint: "detail" },
      alta:  { w: 1920, h: 1080, fps: 30, bitrate: 3500000, hint: "motion" }
    };

    // O espectador pode pedir menos qualidade (celular, internet fraca).
    // Cada pessoa tem a sua própria conexão, então o ajuste vale só para ela.
    const PEDIDOS = {
      leve:      { w: 960, h: 540, fps: 30, bitrate: 1500000 },
      muitoleve: { w: 640, h: 360, fps: 20, bitrate: 600000 }
    };

    let peer = null, stream = null, calls = [], linkAtual = "";
    let modo = null; // "compartilhando" ou "assistindo"
    let tempoViewer = null, tempoRetry = null, connViewer = null, codigoViewer = null;

    // Celulares (Chrome Android, Safari iPhone) não conseguem capturar a tela pelo navegador
    function motivoSemCompartilhar() {
      if (!window.isSecureContext) {
        return "Esta página precisa estar em HTTPS para compartilhar a tela (não funciona abrindo o arquivo direto ou em http).";
      }
      if (!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia)) {
        return "Este aparelho/navegador não permite compartilhar a tela. Para compartilhar, abra esta página no computador (Chrome, Edge ou Firefox). Aqui você pode ASSISTIR normalmente ao lado.";
      }
      return null;
    }

    function status(msg) { $("status").textContent = msg; }
    function qualidade() { return QUALIDADES[$("qualidade").value]; }

    function qualidadeEfetiva(call) {
      const q = qualidade();
      const r = PEDIDOS[call.qualidadePedida];
      if (!r) return q;
      return {
        w: Math.min(q.w, r.w), h: Math.min(q.h, r.h),
        fps: Math.min(q.fps, r.fps), bitrate: Math.min(q.bitrate, r.bitrate), hint: q.hint
      };
    }

    // ---------- PREFERÊNCIAS SALVAS NO NAVEGADOR ----------
    function lerPref(chave, padrao) {
      try {
        const v = localStorage.getItem("tela:" + chave);
        return v === null ? padrao : v;
      } catch (e) { return padrao; }
    }
    function salvarPref(chave, valor) {
      try { localStorage.setItem("tela:" + chave, valor); } catch (e) {}
    }

    function limparCodigo(v) {
      return String(v || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12);
    }

    function atualizarTitulo() {
      if (modo === "compartilhando") document.title = "🔴 Transmitindo (" + calls.length + ")";
      else if (modo === "assistindo") document.title = "▶ Assistindo";
      else document.title = "Compartilhar tela";
    }

    // Avisa antes de fechar a aba se estiver transmitindo
    window.addEventListener("beforeunload", e => {
      if (modo === "compartilhando") { e.preventDefault(); e.returnValue = ""; }
    });

    // ---------- CONFIGURAÇÃO DE REDE ----------
    let configCache = null;
    async function obterConfig() {
      if (configCache) return configCache;
      let base = [];
      try { base = peerjs.util.defaultConfig.iceServers || []; } catch (e) {}
      if (!base.length) {
        base = [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "turn:eu-0.turn.peerjs.com:3478", username: "peerjs", credential: "peerjsp" },
          { urls: "turn:us-0.turn.peerjs.com:3478", username: "peerjs", credential: "peerjsp" }
        ];
      }
      let extra = [{ urls: "stun:stun1.l.google.com:19302" }, { urls: "stun:stun.relay.metered.ca:80" }];
      if (METERED_APP && METERED_KEY) {
        try {
          const r = await fetch("https://" + METERED_APP + ".metered.live/api/v1/turn/credentials?apiKey=" + METERED_KEY);
          const d = await r.json();
          if (Array.isArray(d)) extra = extra.concat(d);
        } catch (e) {}
      }
      configCache = { iceServers: base.concat(extra) };
      return configCache;
    }

    function gerarCodigo() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let s = "";
      for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
      return s;
    }

    async function pedirTela() {
      const q = qualidade();
      const s = await navigator.mediaDevices.getDisplayMedia({
        video: { width: { max: q.w }, height: { max: q.h }, frameRate: { ideal: q.fps, max: q.fps } },
        audio: $("audio").checked
      });
      s.getVideoTracks().forEach(t => { t.contentHint = q.hint; });
      return s;
    }

    // Coloca o H.264 na frente da lista de codecs: na maioria dos computadores
    // ele é codificado pela placa de vídeo, o que alivia muito o processador
    function preferirH264(sdp) {
      const linhas = sdp.split("\r\n");
      const i = linhas.findIndex(l => l.startsWith("m=video"));
      if (i === -1) return sdp;
      const h264 = linhas
        .filter(l => /^a=rtpmap:\d+ H264\//i.test(l))
        .map(l => l.match(/^a=rtpmap:(\d+)/)[1]);
      if (!h264.length) return sdp;
      const partes = linhas[i].split(" ");
      const cabecalho = partes.slice(0, 3);
      const codecs = partes.slice(3);
      linhas[i] = cabecalho
        .concat(h264.filter(c => codecs.includes(c)), codecs.filter(c => !h264.includes(c)))
        .join(" ");
      return linhas.join("\r\n");
    }

    // Limita o bitrate, os fps e a resolução enviados a cada espectador
    function limitarBitrate(call) {
      const q = qualidadeEfetiva(call);
      call.peerConnection.getSenders().forEach(sender => {
        if (!sender.track || sender.track.kind !== "video") return;
        const p = sender.getParameters();
        if (!p.encodings || !p.encodings.length) p.encodings = [{}];
        p.encodings[0].maxBitrate = q.bitrate;
        p.encodings[0].maxFramerate = q.fps;
        const largura = sender.track.getSettings().width;
        if (largura) p.encodings[0].scaleResolutionDownBy = Math.max(1, largura / q.w);
        sender.setParameters(p).catch(() => {});
      });
    }

    // A prévia fica desligada por padrão: decodificar o próprio vídeo gasta RAM
    function atualizarPrevia() {
      if (modo !== "compartilhando") return;
      if ($("previa").checked && stream) {
        video.classList.add("previa");
        video.srcObject = stream;
        video.style.display = "block";
      } else {
        video.srcObject = null;
        video.style.display = "none";
      }
    }
    $("previa").onchange = () => { salvarPref("previa", $("previa").checked ? "1" : "0"); atualizarPrevia(); };
    $("audio").onchange = () => salvarPref("audio", $("audio").checked ? "1" : "0");
    $("qualidade").onchange = () => salvarPref("qualidade", $("qualidade").value);
    $("salaFixa").oninput = () => { $("salaFixa").value = limparCodigo($("salaFixa").value); };
    $("codigo").oninput = () => { $("codigo").value = limparCodigo($("codigo").value); };

    function bloquearBotoes() {
      $("parar").style.display = "inline-block";
      $("compartilhar").disabled = true;
      $("assistir").disabled = true;
    }

    // ---------- QUEM COMPARTILHA ----------
    $("compartilhar").onclick = async () => {
      const semSuporte = motivoSemCompartilhar();
      if (semSuporte) { status(semSuporte); return; }
      const digitado = $("salaFixa").value.trim();
      const fixo = limparCodigo(digitado);
      if (digitado && fixo.length < 3) {
        status("O código da sala precisa ter pelo menos 3 letras ou números.");
        return;
      }
      try {
        stream = await pedirTela();
      } catch (e) {
        status("Não foi possível compartilhar: " + e.message);
        return;
      }
      salvarPref("sala", fixo);
      modo = "compartilhando";
      $("parar").textContent = "Parar";
      stream.getVideoTracks()[0].onended = () => parar();
      bloquearBotoes();
      atualizarPrevia();
      atualizarTitulo();
      status("Conectando...");
      abrirComoCompartilhador(fixo, 0);
    };

    async function abrirComoCompartilhador(fixo, tentativa) {
      const codigo = fixo || gerarCodigo();
      const config = await obterConfig();
      if (!stream) return; // clicou em Parar enquanto carregava
      const meuPeer = new Peer(PREFIXO + codigo, { config });
      peer = meuPeer;

      meuPeer.on("disconnected", () => {
        if (!meuPeer.destroyed) meuPeer.reconnect();
      });

      meuPeer.on("open", () => {
        linkAtual = location.origin + location.pathname + "?c=" + codigo + "&ver=1";
        $("codigoTexto").textContent = codigo;
        $("info").style.display = "block";
        atualizarEspectadores();
        status("Compartilhando! Envie o link (ou o código) para quem vai assistir.");
      });

      meuPeer.on("connection", conn => {
        if (calls.length >= MAX_ESPECTADORES) {
          conn.on("open", () => {
            conn.send("cheio");
            setTimeout(() => conn.close(), 500);
          });
          return;
        }
        let call = null;
        let pedida = null;
        conn.on("data", d => {
          if (d && d.tipo === "qualidade") {
            pedida = d.valor;
            if (call) { call.qualidadePedida = pedida; limitarBitrate(call); }
          }
        });
        conn.on("open", () => {
          call = meuPeer.call(conn.peer, stream, { sdpTransform: preferirH264 });  // sempre manda a tela atual
          call.qualidadePedida = pedida;
          calls.push(call);
          setTimeout(() => limitarBitrate(call), 1000);
          atualizarEspectadores();

          // Se a conexão de alguém falhar ou travar, libera a vaga dele
          const minhaCall = call;
          const descartar = () => {
            if (!calls.includes(minhaCall)) return;
            calls = calls.filter(c => c !== minhaCall);
            atualizarEspectadores();
          };
          const derrubar = () => {
            descartar();
            try { minhaCall.close(); } catch (e) {}
            try { conn.close(); } catch (e) {}
          };
          minhaCall.on("close", descartar);
          minhaCall.on("error", descartar);
          minhaCall.peerConnection.addEventListener("iceconnectionstatechange", () => {
            const st = minhaCall.peerConnection.iceConnectionState;
            if (st === "failed" || st === "closed") derrubar();
          });
          setTimeout(() => {
            const st = minhaCall.peerConnection.iceConnectionState;
            if (st !== "connected" && st !== "completed") derrubar();
          }, 25000);
        });
        conn.on("close", () => {
          if (call) {
            calls = calls.filter(c => c !== call);
            call.close();
          }
          atualizarEspectadores();
        });
      });

      meuPeer.on("error", err => {
        if (err.type === "unavailable-id") {
          meuPeer.destroy();
          if (fixo) {
            if (tentativa < 3) {
              status("Esse código ainda está em uso, tentando de novo...");
              setTimeout(() => { if (stream) abrirComoCompartilhador(fixo, tentativa + 1); }, 1500);
            } else {
              status("Esse código de sala já está em uso por outra transmissão. Escolha outro ou deixe em branco.");
              parar(true);
            }
          } else if (tentativa < 5) {
            abrirComoCompartilhador("", tentativa + 1);
          } else {
            status("Não foi possível criar a sala. Tente de novo.");
            parar(true);
          }
        } else {
          status("Erro de conexão: " + err.type);
        }
      });
    }

    // ---------- TROCAR TELA SEM DERRUBAR A TRANSMISSÃO ----------
    $("trocar").onclick = async () => {
      if (motivoSemCompartilhar()) return;
      let nova;
      try {
        nova = await pedirTela();
      } catch (e) {
        status("Troca cancelada. Continua mostrando a tela anterior.");
        return;
      }
      const novoVideo = nova.getVideoTracks()[0];
      const novoAudio = nova.getAudioTracks()[0] || null;

      calls.forEach(call => {
        call.peerConnection.getSenders().forEach(sender => {
          if (!sender.track) return;
          if (sender.track.kind === "video") sender.replaceTrack(novoVideo);
          else if (sender.track.kind === "audio") sender.replaceTrack(novoAudio);
        });
        limitarBitrate(call);
      });

      // Libera a captura antiga (libera memória)
      if (stream) stream.getTracks().forEach(t => { t.onended = null; t.stop(); });
      stream = nova;
      novoVideo.onended = () => parar();
      atualizarPrevia();
      status("Tela trocada! Os espectadores já estão vendo a nova.");
    };

    // Mostra o que está sendo enviado de verdade e o que está limitando a qualidade
    async function mostrarEstatisticas() {
      if (modo !== "compartilhando" || !calls.length) { $("stats").textContent = ""; return; }
      try {
        const rel = await calls[0].peerConnection.getStats();
        let fps = null, motivo = null, w = null, h = null;
        rel.forEach(r => {
          if (r.type === "outbound-rtp" && r.kind === "video") {
            fps = r.framesPerSecond; motivo = r.qualityLimitationReason; w = r.frameWidth; h = r.frameHeight;
          }
        });
        if (!w || fps == null) return;
        const nomes = { cpu: "processador", bandwidth: "internet" };
        let texto = "Enviando " + w + "x" + h + " a " + Math.round(fps) + " fps";
        if (motivo && motivo !== "none") texto += " (limitado pelo(a) " + (nomes[motivo] || motivo) + ")";
        $("stats").textContent = texto;
      } catch (e) {}
    }
    setInterval(mostrarEstatisticas, 3000);

    function atualizarEspectadores() {
      const n = calls.length;
      $("espectadores").textContent = n + (n === 1 ? " pessoa assistindo" : " pessoas assistindo");
      atualizarTitulo();
    }

    $("copiarLink").onclick = async () => {
      try {
        await navigator.clipboard.writeText(linkAtual);
        $("copiarLink").textContent = "Link copiado!";
        setTimeout(() => $("copiarLink").textContent = "Copiar link de quem assiste", 2000);
      } catch (e) {
        prompt("Copie o link:", linkAtual);
      }
    };

    // ---------- QUEM ASSISTE ----------
    $("assistir").onclick = () => {
      const codigo = limparCodigo($("codigo").value);
      if (!codigo) { status("Digite o código primeiro."); return; }
      iniciarAssistir(codigo);
    };

    function iniciarAssistir(codigo) {
      modo = "assistindo";
      codigoViewer = codigo;
      $("parar").textContent = "Sair";
      bloquearBotoes();
      atualizarTitulo();
      conectarViewer();
    }

    // Se a conexão cair ou a transmissão ainda não tiver começado, tenta de novo sozinho
    async function conectarViewer() {
      if (modo !== "assistindo") return;
      status("Conectando ao servidor...");
      const config = await obterConfig();
      if (modo !== "assistindo") return;

      const meuPeer = new Peer({ config });
      peer = meuPeer;
      let conectou = false, cheio = false, encerrado = false;

      const recomecar = msg => {
        if (encerrado) return;
        encerrado = true;
        clearTimeout(tempoViewer);
        try { meuPeer.destroy(); } catch (e) {}
        if (peer === meuPeer) peer = null;
        if (modo !== "assistindo") return;
        video.srcObject = null;
        video.style.display = "none";
        $("barraVer").style.display = "none";
        status(msg + " Tentando de novo em alguns segundos...");
        tempoRetry = setTimeout(conectarViewer, 5000);
      };

      tempoViewer = setTimeout(() => {
        if (!conectou) recomecar("Ainda não conectou (pode ser a rede).");
      }, 25000);

      meuPeer.on("open", () => {
        status("Procurando quem está compartilhando...");
        const conn = meuPeer.connect(PREFIXO + codigoViewer);
        connViewer = conn;
        conn.on("open", () => {
          status("Achou! Estabelecendo a conexão de vídeo...");
          pedirQualidade();
        });
        conn.on("data", d => {
          if (d === "cheio") {
            cheio = true;
            encerrado = true;
            clearTimeout(tempoViewer);
            status("Essa transmissão está cheia (limite de " + MAX_ESPECTADORES + " pessoas). Tente de novo mais tarde.");
            parar(true);
          }
        });
        conn.on("close", () => { if (!cheio) recomecar("A transmissão terminou."); });
      });

      meuPeer.on("call", call => {
        call.answer(); // aceita a chamada sem enviar nada
        call.on("stream", s => {
          conectou = true;
          clearTimeout(tempoViewer);
          video.classList.remove("previa");
          video.srcObject = s;
          video.style.display = "block";
          $("barraVer").style.display = "flex";
          status("Assistindo.");
        });
      });

      meuPeer.on("error", err => {
        if (err.type === "peer-unavailable") recomecar("Aguardando a transmissão começar.");
        else recomecar("Erro de conexão (" + err.type + ").");
      });
    }

    function pedirQualidade() {
      try {
        if (connViewer && connViewer.open) {
          connViewer.send({ tipo: "qualidade", valor: $("qualidadeVer").value });
        }
      } catch (e) {}
    }
    $("qualidadeVer").onchange = () => {
      salvarPref("qualidadeVer", $("qualidadeVer").value);
      pedirQualidade();
    };

    // Som e tela cheia
    $("som").onclick = () => {
      video.muted = !video.muted;
      $("som").textContent = video.muted ? "🔊 Ativar som" : "🔇 Silenciar";
    };
    function alternarTelaCheia() {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (video.requestFullscreen) video.requestFullscreen();
      else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
    }
    $("telaCheia").onclick = alternarTelaCheia;
    video.ondblclick = alternarTelaCheia;

    // ---------- PARAR ----------
    function parar(manterMensagem) {
      clearTimeout(tempoViewer);
      clearTimeout(tempoRetry);
      connViewer = null;
      codigoViewer = null;
      if (stream) stream.getTracks().forEach(t => { t.onended = null; t.stop(); });
      if (peer) { try { peer.destroy(); } catch (e) {} }
      stream = null; peer = null; calls = []; modo = null;
      video.srcObject = null;
      video.style.display = "none";
      $("parar").style.display = "none";
      $("info").style.display = "none";
      $("barraVer").style.display = "none";
      $("compartilhar").disabled = !!motivoSemCompartilhar();
      $("assistir").disabled = false;
      document.body.classList.remove("compacto");
      atualizarTitulo();
      if (manterMensagem !== true) status("Encerrado.");
    }
    $("parar").onclick = () => parar();

    // ---------- AO ABRIR A PÁGINA ----------
    const ehCelular = (navigator.userAgentData && navigator.userAgentData.mobile) ||
                      /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    let qSalva = lerPref("qualidade", "auto");
    $("qualidade").value = QUALIDADES[qSalva] ? qSalva : "auto";
    $("audio").checked = lerPref("audio", "0") === "1";
    $("previa").checked = lerPref("previa", "0") === "1";
    $("salaFixa").value = limparCodigo(lerPref("sala", ""));
    let qVerSalva = lerPref("qualidadeVer", ehCelular ? "leve" : "auto");
    $("qualidadeVer").value = (qVerSalva === "auto" || PEDIDOS[qVerSalva]) ? qVerSalva : "auto";

    const _motivo = motivoSemCompartilhar();
    if (_motivo) {
      $("avisoCelular").textContent = _motivo;
      $("avisoCelular").style.display = "block";
      $("compartilhar").disabled = true;
    }

    // Link com ?c=CODIGO: entra direto. Com &ver=1, mostra só o vídeo (modo compacto)
    const params = new URLSearchParams(location.search);
    const codigoDaURL = limparCodigo(params.get("c"));
    if (codigoDaURL) {
      $("codigo").value = codigoDaURL;
      if (params.get("ver") === "1") document.body.classList.add("compacto");
      iniciarAssistir(codigoDaURL);
    }
  </script>
</body>
</html>
